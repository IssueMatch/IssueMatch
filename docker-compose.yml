services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: issuematch
      POSTGRES_USER: issuematch
      POSTGRES_PASSWORD: issuematch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuematch"]
      interval: 5s
      retries: 10

  recommender:
    build: ./services/recommender
    ports: [ "8000:8000" ]

  api:
    build: ./services/api
    ports: [ "8080:8080" ]
    environment:
      DB_URL: jdbc:postgresql://db:5432/issuematch
      RECOMMENDER_URL: http://recommender:8000
    depends_on:
      db: { condition: service_healthy }
      recommender: { condition: service_started }

  web:
    build: ./apps/web
    ports: [ "5173:80" ]

volumes:
  pgdata: